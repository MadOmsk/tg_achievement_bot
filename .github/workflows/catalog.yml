# Carry the games catalog from the test server to prod (owner, 2026-10-28):
# the octopus assembles games on the test server, and production shows them.
# By hand only, as many times as wanted — each run replaces prod's catalog
# with the test server's as it is then (scripts/xbox-deploy.sh, `catalog`).
#
# dry_run (the default) rehearses the whole transfer on a copy of prod's
# database and prints what it would do: prod is neither stopped nor written.

name: Catalog

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse on a copy of prod's database; change nothing"
        type: boolean
        default: true

# The same group as prod's deploy (ci.yml): the two never run at once. The
# script also takes a lock on the server, which keeps it apart from the test
# server's deploys as well.
concurrency:
  group: deploy-refs/heads/main
  cancel-in-progress: false

jobs:
  catalog:
    name: Test server → prod
    runs-on: ubuntu-latest
    steps:
      - name: Authorize
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" | tr -d '\r' > ~/.ssh/known_hosts

      - name: Carry the catalog
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          FLAG=""
          if [ "$DRY_RUN" = "true" ]; then FLAG="--dry-run"; fi
          # Port 22022 and HostKeyAlias as in ci.yml's deploy.
          ssh -p 22022 -o HostKeyAlias="$HOST" "$USER@$HOST" sudo /usr/local/bin/xbox-deploy catalog $FLAG
