# Prod: the Mini App, its API and the OAuth callbacks (installed by
# scripts/provision.sh as /etc/nginx/sites-enabled/xbox-bot).
server {
    server_name xbox.sultanpharm.com;

    # Dev bots run on the developers' own machines: the browser that finished
    # the Microsoft login is sent back to that same machine (2026-09-30).
    location = /auth/callback-dev {
        add_header Cache-Control "no-store" always;
        return 302 http://127.0.0.1:8081/auth/callback-dev$is_args$args;
    }

    location = /auth/callback-dev-kreal {
        add_header Cache-Control "no-store" always;
        return 302 http://127.0.0.1:8081/auth/callback-dev-kreal$is_args$args;
    }

    location = /auth/callback-test {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/mini/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /app {
        return 301 /app/;
    }

    location /app/assets/ {
        alias /var/www/xbox-mini/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip on;
        gzip_types application/javascript text/css image/svg+xml;
    }

    location /app/ {
        alias /var/www/xbox-mini/;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache";
        gzip on;
        gzip_types image/svg+xml;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/xbox.sultanpharm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xbox.sultanpharm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name xbox.sultanpharm.com;
    listen 80;
    return 301 https://$host$request_uri;
}
