# The bots' PostgreSQL on the 6-core, 12 GB box (#234): two bots and their
# scripts, a few connections each, a database well under the memory. Installed
# by scripts/provision-postgres.sh into conf.d; shared_buffers needs a restart.
listen_addresses = 'localhost'
max_connections = 50

shared_buffers = 3GB
effective_cache_size = 8GB
work_mem = 32MB
maintenance_work_mem = 512MB

# An SSD, and a small box's writes spread out rather than in bursts.
random_page_cost = 1.1
effective_io_concurrency = 200
checkpoint_completion_target = 0.9
max_wal_size = 2GB
wal_compression = on

log_min_duration_statement = 2000
